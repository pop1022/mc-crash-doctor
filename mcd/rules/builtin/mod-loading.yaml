# Mod-loading failures: missing/incompatible dependencies, duplicate mods,
# wrong Minecraft version, fatal load errors.
#
# These are the highest-volume modded-server failures and the ones users find
# hardest to read, because the loader's wording differs completely between
# Forge (1.7-1.12 vs 1.13+) and Fabric/Quilt. Patterns below were derived from
# real reports, not guessed.

rules:
  - id: mod.dep-missing.forge
    title: "Missing required mod: {{cap:text:1}}"
    severity: fatal
    priority: 11
    confidence: 0.95
    tags: [dependency, load-time, forge]
    when:
      exception:
        - "MissingModsException"
      text:
        - "requires \\[([\\w@.\\-,\\s()\\[\\]]+)\\]"
    explanation: >-
      Forge refused to start because a mod declared a mandatory dependency that
      is not installed. The bracketed list is Forge's version-range syntax:
      `redstoneflux@[2.1.0,2.2.0)` means "redstoneflux, any version from
      2.1.0 up to but not including 2.2.0".
    fixes:
      - "Install the mod(s) named in the range, at a version inside that range."
      - "Download them for Minecraft {{mc_version}} and loader {{loader}}."
      - "If you deliberately removed the dependency, also remove the mod that needs it."
    suspects_from: []
    refs:
      - "https://docs.minecraftforge.net/en/latest/concepts/dependencies/"

  - id: mod.dep-missing.forge-old
    title: "Missing required mod (Forge 1.12 and older)"
    severity: fatal
    priority: 11
    confidence: 0.9
    tags: [dependency, load-time, forge]
    when:
      exception:
        - "MissingModsException"
      text:
        - "MissingModsException:\\s*Mod\\s+(\\w+)"
    explanation: >-
      Same diagnosis as above, matched without a version range (older Forge
      prints only the mod ids).
    fixes:
      - "Install every mod id listed in the log line."
      - "Match the Minecraft version exactly -- a 1.12.2 dependency will not satisfy 1.16.5."
    suspects_from: []

  - id: mod.dep-missing.fabric
    title: "Missing required mod: {{cap:text:1}}"
    severity: fatal
    priority: 11
    confidence: 0.95
    tags: [dependency, load-time, fabric]
    when:
      exception:
        - "ModResolutionException"
        - "net\\.fabricmc\\.loader\\.discovery\\.[\\w.]+Exception"
      text:
        - "requires (?:any version of mod|version [\\w.\\-]+ or later of mod) ([\\w\\-]+), which is missing"
    explanation: >-
      Fabric's mod resolver could not satisfy a dependency. The line names both
      the mod that needs it and the mod that is missing.
    fixes:
      - "Install the missing mod named in the log, for {{mc_version}} / fabric."
      - "If a specific version is required (`version 0.4.6 or later`), install that version or newer."
      - "Fabric needs every entry in the dependency chain -- install the mod *and* its libraries."
    suspects_from: []
    refs:
      - "https://docs.modrinth.com/docs/mods/dependencies/"

  - id: mod.incompatible-set
    title: "Incompatible mod set: {{cap:text:1}}"
    severity: fatal
    priority: 12
    confidence: 0.9
    tags: [dependency, conflict, load-time]
    when:
      exception:
        - "FormattedException"
        - "ModResolutionException"
      text:
        # Fabric resolver phrasings (real reports, harvested 2026-09):
        #   "Some of your mods are incompatible with the game or each other!"
        #   "Incompatible mods found!"
        #   "mod 'Sodium' (sodium) requires any 0.8.x version ..., but only the
        #    wrong version is present: 0.9.1+mc26.1.2!"
        #   "mod 'Iris' (iris) ... incompatible with version 1.11.1 or earlier
        #    ... yet a conflicting version is present"
        - "mod '([^']+)' \\(([\\w\\-]+)\\)[^.\\n]*(?:requires|incompatible with|conflicts? with|but only the wrong version)"
        - "Some of your mods are incompatible with the game or each other"
        - "Incompatible mods found"
        - "incompatible mod set|is incompatible with any version of mod '([\\w\\- ]+)'"
    explanation: >-
      Two mods cannot run together -- one declares a version range the other
      violates, or they explicitly conflict. The resolver line names the exact
      pair and the version it wanted vs what is installed.
    fixes:
      - "Read the resolver line: it says which mod needs which version range and what you actually have."
      - "Update the lagging mod, or pin the pair to versions that overlap."
      - "If the conflict is unresolvable (one mod forbids the other), remove one."
      - "Common cause: a mod pinned to an old Sodium/Fabric-API range after you updated the other."
    suspects_from: []

  - id: mod.wrong-mc-version
    title: "Mod {{cap:text:1}} does not support Minecraft {{mc_version}}"
    severity: fatal
    priority: 14
    confidence: 0.92
    tags: [version-mismatch, load-time]
    when:
      text:
        - "The mod ([\\w\\-]+) does not wish to run in Minecraft version"
        - "Wrong Minecraft version for ([\\w\\-]+)"
        - "does not support Minecraft|was built for Minecraft|Unsupported Minecraft version"
    explanation: >-
      The server is Minecraft {{mc_version}} but this mod was built for a
      different version. Forge refuses to load it rather than risk corrupting
      the world.
    fixes:
      - "Remove the named mod, or install its build for {{mc_version}}."
      - "If no build exists for {{mc_version}}, look for a maintained fork."
      - "After updating a modpack, re-download the whole set -- partial updates cause exactly this."
    suspects_from: []

  - id: mod.duplicate
    title: "Duplicate mod files installed"
    severity: fatal
    priority: 13
    confidence: 0.9
    tags: [duplicate, load-time]
    when:
      text:
        - "Found duplicate mods|Duplicate mod|multiple mod files|is present more than once|Found a duplicate id"
    explanation: >-
      Two files in the mods folder provide the same mod id. Almost always an
      old jar left behind after a manual update.
    fixes:
      - "Search the mods folder for the mod name and keep exactly ONE file -- the newest for {{mc_version}}."
      - "Sort the folder by name to spot `foo-1.0.jar` next to `foo-1.1.jar`."
    suspects_from: []

  - id: mod.load-fatal
    title: "A mod failed fatally during {{cap:text:1}}"
    severity: fatal
    priority: 18
    confidence: 0.8
    tags: [mod, load-time]
    when:
      text:
        - "Fatal errors were detected during the transition from (\\w+) to (\\w+)"
        - "Caught exception from ([\\w\\-]+)|Loading entrypoint .{0,40} threw"
    explanation: >-
      A mod threw while the loader was moving through its startup phases. The
      states table just below this line in your log shows which mods reached
      which phase -- the first `E` (Errored) entry is the culprit.
    fixes:
      - "In the log's `States:` table, find the mod marked `E` instead of `A`."
      - "Update that mod; if it is unmaintained for {{mc_version}}, remove it."
      - "On Fabric/Quilt the equivalent line names the failing entrypoint directly."
    suspects_from: ["frame_mods", "jar"]

  - id: mod.config-invalid
    title: "A config file failed to parse"
    severity: error
    priority: 30
    confidence: 0.85
    tags: [config, load-time]
    when:
      exception:
        - "com\\.google\\.gson\\.JsonSyntaxException"
        - "com\\.electronwill\\.nightconfig[\\w.]*"
        - "ConfigParseException"
        - "JsonSyntaxException"
      text:
        - "(?:config|\\.toml|\\.json5?|\\.cfg)[^\\n]{0,80}(?:invalid|syntax|parse|error|malformed)"
    explanation: >-
      A configuration file is malformed -- typically a hand-edit that broke the
      syntax (trailing comma, unquoted key, mismatched bracket, tabs in YAML).
    fixes:
      - "The log names the file. Validate it: a trailing comma is the usual JSON cause."
      - "Deleting the file makes the mod regenerate a default -- the server starts, you lose your edits."
      - "Diff against the same file from a fresh instance to find the broken line."
    suspects_from: ["jar"]

  - id: mod.coremod-missing
    title: "A coremod / library jar is missing from the classpath"
    severity: fatal
    priority: 19
    confidence: 0.75
    tags: [load-time, classpath]
    when:
      exception:
        - "java\\.lang\\.NoClassDefFoundError"
        - "java\\.lang\\.ClassNotFoundException"
      text:
        - "Attempted to load class ([\\w/$]+)|NoClassDefFoundError:? ?([\\w/$]+)"
    explanation: >-
      A class the loader needed is not on the classpath. On modded servers this
      usually means a library mod is missing, or a mod jar was deleted while its
      dependents stayed.
    fixes:
      - "Identify the missing class's package prefix in the evidence line -- that is usually the library mod."
      - "Install that library mod for {{mc_version}}."
      - "If the class is `net/minecraft/client/...` on a *server*, a client-only mod is installed on the server -- remove it."
    suspects_from: ["frame_mods", "jar"]

  - id: mod.corrupt-jar
    title: "A mod jar is corrupt or empty: {{cap:text:1}}"
    severity: fatal
    priority: 18
    confidence: 0.95
    tags: [corrupt, load-time, jar]
    when:
      exception:
        - "java\\.util\\.zip\\.ZipException"
        - "ZipException"
      text:
        # Real messages (harvested 2026-09): "zip file is empty",
        # "zip END header not found", "invalid CEN header", "invalid LOC header".
        # The path just before "]:" is the offending jar.
        - "([^\\\\/\\[\\]]+\\.jar)\\]:\\s*java\\.util\\.zip\\.ZipException"
        - "zip file is empty|zip END header not found|invalid (?:CEN|LOC) header|Not in GZIP format|error in opening zip file"
    explanation: >-
      A jar in the mods folder (or a library on the classpath) is not a valid
      zip -- the download was truncated, interrupted, or the file got zeroed.
      The named file cannot be read at all, so the loader aborts before the
      game starts. This is never a config or compatibility problem.
    fixes:
      - "Delete the named jar and re-download it (the file is corrupt, not just outdated)."
      - "Re-download from the official source (Modrinth/CurseForge); a partial download is the usual cause."
      - "If it is a library under `libraries/` (e.g. icu4j), delete that file too -- the launcher re-fetches it."
      - "Check disk health if several jars are corrupt at once."
    suspects_from: ["jar"]

  - id: mod.binary-incompat
    title: "Binary incompatibility: a mod calls a field/method that no longer exists"
    severity: fatal
    priority: 17
    confidence: 0.85
    tags: [version-mismatch, runtime, library]
    when:
      exception:
        - "java\\.lang\\.NoSuchFieldError"
        - "java\\.lang\\.NoSuchMethodError"
      text:
        # harvested 2026-09 (sodium#3711, fabric-api#5363, fabric-loader#611):
        #   "Class net.fabricmc.fabric.api.resource.ResourceReloadListenerKeys
        #    does not have member field '...'"
        - "does not have (?:member field|method)|NoSuchFieldError|NoSuchMethodError"
    explanation: >-
      A mod was compiled against a different version of Minecraft or a library
      (Fabric API / Forge / another mod's API) than the one running: the field
      or method it calls is gone. Classic symptom of updating one half of a
      mod pair without the other.
    fixes:
      - "The message names the class whose member is missing -- that class belongs to the API the mod was built against."
      - "Update BOTH sides: the mod and the library/API it needs, to versions released for {{mc_version}}."
      - "If you just updated Fabric API / Forge, the mod itself is now too old -- update or remove it."
    suspects_from: ["frame_mods", "jar", "mixin"]

  - id: mod.linkage-duplicate
    title: "Class linkage conflict: two mods ship the same class"
    severity: fatal
    priority: 17
    confidence: 0.85
    tags: [conflict, load-time, classpath]
    when:
      exception:
        - "java\\.lang\\.LinkageError"
        - "LinkageError"
      text:
        # harvested 2026-09 (fabric-loader#1132/#622/#627, quilt-loader#232):
        #   "loader constraint violation", "attempted duplicate class definition"
        - "loader constraint violation|attempted duplicate class definition|LinkageError"
    explanation: >-
      Two jars on the classpath define the same class (a mod bundling a
      library another mod also bundles, or a leftover copy of a mod). The
      classloader refuses to pick one and aborts.
    fixes:
      - "The 'loader constraint violation' line names the duplicated class and both classloaders -- search your mods folder for jars containing that package."
      - "Delete duplicate copies of the same mod (old version left beside the new one is the usual cause)."
      - "If two different mods bundle the same library, update both -- newer builds shade or drop the duplicate."
    suspects_from: ["frame_mods", "jar"]

  - id: quilt.config-broken
    title: "Quilt config/JSON5 file is malformed"
    severity: fatal
    priority: 19
    confidence: 0.8
    tags: [config, load-time, quilt]
    when:
      exception:
        - "MalformedSyntaxException"
        - "ParsingException"
      text:
        # harvested 2026-09 (quilt-loader#244 "Not enough data available",
        # quilt-loader#261 "Found potentially valid JSON5, but invalid JSON
        # while in strict mode $.version")
        - "invalid JSON5?|Not enough data available|MalformedSyntaxException"
    explanation: >-
      A quilt.mod.json / config file is not valid JSON(5) -- the message names
      the field path (e.g. `$.version`). Usually a hand edit or a partially
      written file.
    fixes:
      - "The message names the file and JSON path -- open that file and fix the syntax at that field."
      - "JSON5 allows comments and trailing commas, but strict-mode files do not -- check which the loader asked for."
      - "Deleting the file usually regenerates a default on next start."
    suspects_from: ["jar"]

  - id: loader.namespace-missing
    title: "Requested mapping namespace is not loaded"
    severity: fatal
    priority: 18
    confidence: 0.8
    tags: [mappings, load-time, quilt, fabric]
    when:
      text:
        # harvested 2026-09 (quilt-loader#497): "Requested target namespace
        # intermediary not loaded. To continue without mappings..."
        - "Requested target namespace ([\\w]+) not loaded"
    explanation: >-
      The loader could not load the mapping namespace a mod asked for --
      mapping jars are missing or corrupt in the instance, or the launcher
      failed to download them.
    fixes:
      - "Reinstall/repair the instance in your launcher -- this re-downloads the mapping (intermediary/yarn) jars."
      - "If offline-mode or a custom launcher is involved, check it can reach the mapping download server."
      - "As a test, a fresh instance of the same loader version isolates whether the instance or a mod is broken."
    suspects_from: []

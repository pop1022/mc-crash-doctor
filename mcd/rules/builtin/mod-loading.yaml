  - id: loader.game-provider-missing
    title: "The loader could not find the game itself"
    title_zh: "加载器找不到游戏本体"
    explanation_zh: >-
      启动器把模组加载器拉起来了，但加载器后面没有 Minecraft：工作目录指向一个空实例或装了一半的实例。
      这是启动器或实例的问题，不是模组问题，换哪个模组版本都没用，上面那段堆栈只是加载器发现了这件事。
    fixes_zh:
    - "让启动器指向一个含 versions/<mc-version>/ 且带原版 jar 的实例，或者重装该实例。"
    - "如果是手动启动的，要在实例目录（含 mods/ 的那层）里跑，不要在启动器根目录。"
    - "Prism 或 MultiMC：Edit Instance 然后是 Version，重新下载游戏文件。"
    severity: fatal
    priority: 9
    confidence: 0.9
    tags: [launcher, load-time, fabric, quilt]
    when:
      exception_msg:
        - "game provider couldn't locate the game"
    explanation: >-
      The launcher started the mod loader, but the loader found no Minecraft
      installation behind it: the working directory points at an empty or
      half-installed instance. This is a launcher/instance problem, not a mod
      problem -- no mod version will fix it, and the stack trace above the
      message is only the loader noticing.
    fixes:
      - "Point the launcher at an instance that has a `versions/<mc-version>/` folder with the vanilla jar, or reinstall that instance."
      - "If you started it by hand, run from the instance directory (the one containing `mods/`), not from the launcher's root folder."
      - "In Prism/MultiMC: Edit Instance -> Version -> re-download the game files."
    suspects_from: []
    provenance:
      fixtures:
      - fabric-loader/714
    lifecycle_status: verified

  - id: mixin.class-already-loaded
    title: "A class was already loaded when mixin tried to patch it"
    title_zh: "mixin 要改的类已经被加载了"
    explanation_zh: >-
      mixin 应用补丁时发现目标类已经加载，于是放弃。实际意味着这次启动里有两样东西想改同一个类：
      通常是同一个模组装了两遍（正常 jar 旁边还有 dev、api、universal 副本，
      或者两个版本），也可能是某个模组把一个改过的 Minecraft 类和真正的那个放在一起。
    fixes_zh:
    - "mods 里每个模组只留一个 jar：找后缀或版本不同的第二份。"
    - "如果冒号后面点名的是 Minecraft 类，找找游戏文件旁边有没有 minecraft-client-patched-*.jar 这类补丁 jar。"
    - "别指望日志会变：mixin 状态是每次启动独立的，删掉重复文件重启，而不是重读这份崩溃。"
    severity: error
    priority: 12
    confidence: 0.85
    tags: [mixin, load-time, duplicate]
    when:
      exception:
        - "ClassAlreadyLoadedException"
    explanation: >-
      Mixin found its target class already loaded when it tried to apply a
      patch, so it refused. In practice this means two things tried to transform
      the same class in one launch: usually the same mod installed twice (a
      normal jar plus a `-dev`/`-api`/`-universal` copy, or two versions), or a
      mod shipping a patched copy of a Minecraft class next to the real one.
    fixes:
      - "Keep exactly one jar per mod in `mods/` -- look for a second copy with a different suffix or version."
      - "If the class named after the colon is a Minecraft class, look for a patched-game jar (for example `minecraft-client-patched-*.jar`) sitting next to the normal game files."
      - "Do not expect the log to update: mixin state is per-launch, so remove the duplicate and restart rather than re-reading this crash."
    suspects_from: []
    provenance:
      fixtures:
      - ModernFix/533
    lifecycle_status: verified

  - id: quilt.version-constraint-unreadable
    title: "Quilt could not read a mod's loader version constraint"
    title_zh: "Quilt 读不懂某个模组的加载器版本约束"
    explanation_zh: >-
      某个模组声明加载器依赖时用了 Quilt 元数据读取器不接受的值类型（模式要字符串，它给了对象）
      。Quilt 不愿猜你的意思，直接停住，所以什么都没加载，尽管这个模组在别的加载器上可能是好的。
    fixes_zh:
    - "更新那个模组：修法几乎总是更新的元数据（作者要输出纯字符串）。"
    - "如果它在 Fabric 上能用，就把整合包跑在 Fabric 上，这种元数据结构是冲着 Fabric 模式去的。"
    - "把日志里的模组 id 报给作者，他们那边改一行就行。"
    severity: error
    priority: 12
    confidence: 0.85
    tags: [quilt, metadata, load-time]
    when:
      exception:
        - "ClassCastException"
      exception_msg:
        - "Cannot coerce loader value to a String"
    explanation: >-
      A mod declares its loader dependency with a value type Quilt's metadata
      reader does not accept -- an object where the schema expects a string.
      Quilt stops instead of guessing which version you meant, so nothing loads
      even though the mod itself may be fine on another loader.
    fixes:
      - "Update that mod: the fix is almost always newer metadata (the author needs to emit a plain string)."
      - "If the mod works on Fabric, run the pack on Fabric -- this metadata shape targets Fabric's schema."
      - "Report the mod id from the log to its author; it is a one-line change on their side."
    suspects_from: []
    provenance:
      fixtures:
      - quilt-loader/368
    lifecycle_status: verified

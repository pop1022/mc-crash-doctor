# Runtime crash catch-alls and loader-message variants.
#
# Derived from 20 real harvested reports (mekanism/Mekanism issues, 2026-09)
# that the original rule packs left undiagnosed. Each pattern below was copied
# from an actual report, not invented -- see tests/test_gaps.py which pins
# every rule here against the file that motivated it.

rules:
  - id: mod.load-failed.neoforge
    title: "Mod loading failed (NeoForge loader error)"
    title_zh: "模组加载失败（NeoForge 加载器报错）"
    explanation_zh: >-
      一个或多个模组加载时抛异常，NeoForge 中止了启动。真正的成因在报告更深处：找第一个
      Caused by，或者 loading-error 段里点名的模组。
    fixes_zh:
    - "往下翻到这个异常下面的第一个 Caused by，那里点名了模组和真实错误。"
    - "更新或删掉那里点名的模组；如果是刚加的或刚更新的，先回滚这次改动。"
    - "如果成因是缺前置，按 {{mc_version}} 装上它点名的库模组。"
    severity: fatal
    priority: 17
    confidence: 0.85
    tags: [mod, load-time, neoforge]
    when:
      exception: ["net\\.neoforged\\.fml\\.ModLoadingException|ModLoadingException"]
      text: ["Loading errors encountered"]
    explanation: >-
      NeoForge aborted startup because one or more mods threw while loading.
      The detailed cause is deeper in the report -- look for the first
      `Caused by:` or the mod named in the loading-error section.
    fixes:
      - "Scroll to the first 'Caused by:' under this exception -- that names the mod and the real error."
      - "Update or remove the mod named there; if it was just added/updated, revert that change first."
      - "If the cause is a missing dependency, install the library mod it names for {{mc_version}}."
    suspects_from: ["frame_mods", "jar", "mixin"]
    provenance:
      fixtures:
      - mekanism/8631
      - mekanism/8633
      - harvested:Jade/584
      - harvested:Mekanism/8483
    lifecycle_status: verified

  - id: mod.load-failed.fabric-entry
    title: "Mod loading failed: {{cap:text:1}}"
    title_zh: "模组加载失败：{{cap:text:1}}"
    explanation_zh: >-
      某个模组在加载时抛异常，加载器中止。报告在错误段靠前的位置列出了失败的模组和它的 entrypoint。
    fixes_zh:
    - "在 Mod Loading has failed 段里找点名的模组，就是要更新或删掉的那个。"
    - "确认它的依赖都在，且版本满足要求。"
    - "如果它刚更新过，退回上一版试试。"
    severity: fatal
    priority: 17
    confidence: 0.85
    tags: [mod, load-time]
    when:
      description: ["Mod loading error has occurred"]
      text: ["Mod Loading has failed|Loading errors were encountered|Error loading mod"]
    explanation: >-
      A mod threw during loading and the loader aborted. The report lists the
      failing mod and its entrypoint near the top of the error section.
    fixes:
      - "Find the mod named in the 'Mod Loading has failed' section -- that is the one to update or remove."
      - "Check its dependencies are present at the versions it requires."
      - "If the mod was recently updated, try the previous version."
    suspects_from: ["frame_mods", "jar"]
    provenance:
      fixtures:
      - mekanism/8391
      - mekanism/8479
      - mekanism/8539
      - harvested:Placebo/36
      - harvested:Curios/278
    lifecycle_status: verified

  - id: mod.client-class-on-server
    title: "A client-only class was loaded on the dedicated server"
    title_zh: "服务端加载了仅客户端的类"
    explanation_zh: >-
      某个模组（或它的 mixin）在通用或服务端代码里引用了仅客户端的类（{{cap:text:1}}）
      。Forge 与 NeoForge 会拦下这种调用，免得专用服务器运行时崩溃，这说明该模组的端侧隔离是坏的。
    fixes_zh:
    - "错误下面的堆栈帧点名了做加载的模组：更新它，这是一类有已知修法的已知 bug。"
    - "如果是更新某个模组之后才出现的，把这个模组回滚。"
    - "这永远是模组的 bug，不是你的服务端配置问题：带上这份报告去上游报。"
    severity: fatal
    priority: 17
    confidence: 0.95
    tags: [mod, load-time, dist, server]
    when:
      text: ["Attempted to load class (net/minecraft/client/[\\w/$]+) for invalid dist DEDICATED_SERVER"]
    explanation: >-
      A mod (or one of its mixins) referenced a client-only class
      (`{{cap:text:1}}`) from common/server code. Forge/NeoForge block this to
      stop the dedicated server from crashing at runtime -- the mod's dist
      separation is broken.
    fixes:
      - "The stack frames below the error name the mod doing the loading -- update it; this is a known bug class with a known fix."
      - "If it appeared after updating one mod, roll that mod back."
      - "This is always the mod's bug, never your server config -- report it upstream with this crash report."
    suspects_from: ["frame_mods", "jar", "mixin"]
    provenance:
      fixtures:
      - mekanism/8354
      - harvested:twilightforest/2564
      - harvested:twilightforest/2686
    lifecycle_status: verified

  - id: crash.runtime-mod
    title: "{{suspect_top}} crashed at runtime"
    title_zh: "{{suspect_top}} 在运行时崩了"
    explanation_zh: >-
      出错的代码路径经过 {{suspect_top}}（归因置信度 {{suspect_top_conf}}）。异常本身很泛，但堆栈指向这个模组的类。
    fixes_zh:
    - 把 {{suspect_top}} 更新到 {{mc_version}} 的最新版：这类运行时 NPE/ISE 通常很快被修。
    - 如果已经是最新，把这份崩溃报告提到该模组的 issue 区。
    - 临时方案：删掉 {{suspect_top}} 以及依赖它的模组。
    severity: error
    priority: 80
    confidence: 0.55
    tags: [mod, runtime]
    when:
      has_suspect: true
      exception: ["java\\.lang\\.[\\w.]*(?:Exception|Error)"]
      # ... but an OOM is not "this mod crashed". `oom.heap` owns that failure
      # and gives heap advice; this rule's fixes talk about NPEs/ISEs and
      # "update the mod", which is the wrong instruction for an exhausted heap.
      # Dogfood issue #1 was exactly this: an OutOfMemoryError report got both
      # findings, and the second told the user to update a mod. Measured cost
      # of excluding it: zero -- neither corpus contains a single OOM report,
      # so no rule loses a real hit (see the note in tests/test_rule_fixtures).
      not_exception: ["java\\.lang\\.OutOfMemoryError"]
      # must NOT shadow the specific crash.* rules (they run at priority 50-60)
    explanation: >-
      The failing code path runs through {{suspect_top}}
      (attribution confidence {{suspect_top_conf}}). The exception itself is
      generic, but the stack points at this mod's classes.
    fixes:
      - "Update {{suspect_top}} to the latest build for {{mc_version}} -- runtime NPEs/ISEs like this are usually fixed quickly."
      - "If it is already up to date, report this crash report to the mod's issue tracker."
      - "As a workaround, remove {{suspect_top}} and anything that depends on it."
    suspects_from: ["frame_mods", "mixin", "jar"]
    # The OOM report also has a stack, so a catch-all would blame a mod for it.
    # quiet pins the not_exception guard; fires keeps the rule from being
    # quietly disabled by a future condition edit.
    expect:
      fires:
      - ground-truth/crash-2026-09-08_22.31.14-server.txt
      quiet:
      - ground-truth/crash-2026-09-08_18.01.19-server.txt
    provenance:
      fixtures:
      - mekanism/8590
      - mekanism/8483
      - gt:crash-2026-09-08_18.39.21-server.txt
      - harvested:sodium/3511
      expect_suspects:
        "mekanism/8590": mekanism
        "mekanism/8483": create
    lifecycle_status: verified

  - id: crash.rendering-blockentity
    title: "Crash while rendering a block entity"
    title_zh: "渲染方块实体时崩溃"
    explanation_zh: >-
      客户端在画某个方块实体（机器、箱子、展示方块）时崩了。方块类型和坐标都在报告里。
    fixes_zh:
    - "在报告里读 Block entity type 和 Location，那点名了它所属的模组。"
    - "更新那个模组；渲染崩溃通常跟着更新后的模型或注册表改动走。"
    - "如果区块一加载就复发，用 MCA Selector 或世界编辑删掉这个方块。"
    severity: error
    priority: 53
    confidence: 0.65
    tags: [rendering, client, block-entity]
    when:
      description: ["Rendering Block Entity"]
    explanation: >-
      The client crashed drawing a block entity (a machine, chest, display
      block...). The block's type and position are in the report.
    fixes:
      - "Read 'Block entity type' and 'Location' from the report -- that names the owning mod."
      - "Update that mod; rendering crashes usually follow a model/registry change after an update."
      - "Removing the block (via MCA Selector or a world edit) stops the crash loop if it re-triggers on chunk load."
    suspects_from: ["frame_mods", "jar"]
    provenance:
      fixtures:
      - mekanism/8518
      - harvested:sodium/3725
      - harvested:RFTools/2101
    lifecycle_status: verified

  - id: crash.threading-race
    title: "Threading violation: world data touched off-thread"
    title_zh: "线程违规：世界数据被跨线程访问"
    explanation_zh: >-
      原版的随机数和若干注册表是刻意做成单线程的；Minecraft 现在会检测跨线程访问，宁可抛异常也不坏存档。
      某个模组在工作线程里调用了世界相关代码，或者并行区块加载器在跟它抢。
    fixes_zh:
    - "堆栈里第一个非原版帧就是做跨线程调用的模组。"
    - "如果装了并行加载类模组（modernfix、starlight 系），先更新它或关掉它的线程选项。"
    - "更新出问题的模组；这是模组 bug，不是配置问题。"
    severity: error
    priority: 45
    confidence: 0.8
    tags: [threading, runtime]
    when:
      exception_msg: ["Accessing LegacyRandomSource from multiple threads|not on the server thread|main thread only"]
    explanation: >-
      Vanilla's RNG and several registries are single-threaded on purpose;
      Minecraft now detects cross-thread access and throws instead of
      corrupting the world. A mod is calling world code from a worker thread
      (or a parallel chunk loader is racing it).
    fixes:
      - "The top non-vanilla frame in the trace names the mod doing the off-thread call."
      - "If a parallel-loading mod is installed (modernfix, starlight-style chunk threading), try updating it or disabling its threading option first."
      - "Update the offending mod; this is a mod bug, not a config problem."
    suspects_from: ["frame_mods", "mixin"]
    provenance:
      fixtures:
      - mekanism/8531
      - harvested:Mekanism/8531
    lifecycle_status: verified

  - id: crash.datapack-book
    title: "A datapack/resourcepack entry failed to load"
    title_zh: "数据包或资源包条目加载失败"
    explanation_zh: >-
      某个书或数据包定义格式错误，或者引用了没装的包。报错里的 id 点名了出问题的内容。
    fixes_zh:
    - "找出注册该 id 的包（书来自 Patchouli 系模组）并更新它。"
    - "如果是 world/datapacks 里的自定义数据包，校验它的 JSON：一个坏文件会让整次加载失败。"
    - "移除该数据包目录，世界就能加载。"
    severity: error
    priority: 46
    confidence: 0.8
    tags: [datapack, resourcepack, load-time]
    when:
      exception_msg: ["has use_resource_pack|Failed to load (?:datapack|resource pack)|Couldn't pack"]
      text: ["Book ([\\w:]+) has use_resource_pack|datapack|resource pack"]
    explanation: >-
      A book/datapack definition is malformed or references a pack that is
      not installed. The id in the error names the offending content.
    fixes:
      - "Find the pack that registers the named id (books come from Patchouli-based mods) and update it."
      - "If it is a custom datapack in world/datapacks, validate its JSON -- a single bad file fails the whole load."
      - "Removing the datapack folder lets the world load without it."
    suspects_from: ["frame_mods"]
    provenance:
      fixtures:
      - mekanism/8423
      - harvested:Jade/483
      - harvested:twilightforest/2533
    lifecycle_status: verified

  - id: mixin.injection-failed
    title: "Mixin injection failed: {{cap:exception_msg:1}}"
    title_zh: "mixin 注入失败：{{cap:exception_msg:1}}"
    explanation_zh: >-
      某个 mixin 的注入器打不进目标：通常是两个模组用不兼容的签名改同一个方法（旧模组的 @WrapOperation
      或 @Redirect 撞上新版本的改动），或者目标方法在 MC 更新里改了形状。报错点名的
      mixin 方法（模组id$方法名）就指明了它属于哪个模组。
    fixes_zh:
    - "报错里失败的注入器写成 模组id$方法名，那个模组就是坏掉的 mixin 的主人。"
    - "更新它；如果目标方法还有别的模组也在改，两边都要更新，必须针对同一个 MC 版本构建。"
    - "如果新 MC 版本刚发布，等这个模组更新：这类注入失败没法靠配置绕开。"
    severity: fatal
    priority: 15
    confidence: 0.9
    tags: [mixin, load-time, conflict]
    when:
      exception:
        - "org\\.spongepowered\\.asm\\.mixin\\.injection\\.[\\w.]+(?:Error|Exception)"
      exception_msg:
        # harvested 2026-09 (fabric-api#5097 iris$makeColor @WrapOperation,
        # fabric-api#5279 "LVT ... has incompatible changes"):
        - "(Critical injection failure[^\n]{0,80}|LVT in [^\n]{0,60}has incompatible changes|@\\w+ annotation on [\\w$]+ could not[^\n]{0,60})"
    explanation: >-
      A mixin's injector could not patch its target -- usually because two
      mods patch the same method with incompatible signatures (an older mod's
      @WrapOperation/@Redirect colliding with a newer one's changes), or the
      target method changed shape in an MC update. The message names the mixin
      method (`<modid>$<method>`), which names the mod that owns it.
    fixes:
      - "The failing injector is named '<modid>$<method>' in the error -- that mod owns the broken mixin."
      - "Update it; if it targets a method another mod also patches, update BOTH (the pair must be built against the same MC version)."
      - "If a fresh MC version dropped: wait for the mod's update -- injection failures like this cannot be configured around."
    suspects_from: ["mixin", "frame_mods", "jar"]
    provenance:
      fixtures:
      - fabric-api/5097
      - harvested:fabric-api/4486
      - harvested:fabric-api/4922
    lifecycle_status: verified

  - id: crash.registry-load-failed
    title: "Registry loading failed -- a mod registered invalid entries"
    title_zh: "注册表加载失败：某个模组注册了非法条目"
    explanation_zh: >-
      进入或加载世界时动态注册表中止：某个模组注册的条目过不了校验（id 非法、缺必填字段、键重复）
      。真正的成因记在这个异常的上方，这一行只是总结。
    fixes_zh:
    - "往上翻到这次崩溃上方的第一行 ERROR，那里会点名注册表键和拥有它的模组。"
    - "通常是数据包驱动的注册表条目（世界生成、生物群系、维度模组）引用了新版本改名过的东西：更新那个模组。"
    - "如果去掉疑似模组后世界能正常加载，那它的数据包条目就是元凶。"
    severity: fatal
    priority: 47
    confidence: 0.8
    tags: [registry, load-time, world-load]
    when:
      exception_msg:
        # harvested 2026-09: 12x fabric-api issues, all with this exact wording
        # and 'fabric-registry-sync-v0' on the game's Suspected Mods line
        - "Failed to load registries due to above errors"
    explanation: >-
      Dynamic registry loading aborted while entering/loading a world: a mod
      registered an entry that fails validation (bad id, missing required
      field, duplicate key). The REAL cause is logged ABOVE this exception --
      this line is only the summary.
    fixes:
      - "Scroll up to the first ERROR line above this crash -- it names the registry key and the mod that owns it."
      - "Usually a datapack-driven registry entry (worldgen/biome/dimension mods) referencing something a newer MC version renamed -- update that mod."
      - "If the world loads fine without the suspected mod, its datapack entries are the culprit."
    suspects_from: ["frame_mods", "mod_from_triage"]
    provenance:
      fixtures:
      - fabric-api/4862
      - harvested:fabric-api/4862
      - harvested:fabric-api/4909
    lifecycle_status: verified

  - id: net.connectivity
    title: "Network failure reaching a remote host: {{cap:exception_msg:1}}"
    title_zh: "连接远程主机失败：{{cap:exception_msg:1}}"
    explanation_zh: >-
      游戏或某个模组连不上远程主机，或者 TLS 证书对不上：DNS 被拦、有过滤代理或防火墙、JVM
      信任库里的证书过期，或者公司做了中间人代理。这是环境问题，不是模组 bug。
    fixes_zh:
    - "检查点名的域名的 DNS 与防火墙规则；有些网络（学校、运营商、地区级过滤）会拦或劫持这些端点。"
    - "如果在做 TLS 拦截的公司代理后面，把它的根证书导进 JVM 的 cacerts，或对这些域名关掉拦截。"
    - "太旧的 Java 也会在现代证书上失败：更新 Java（当前 MC 用 17 或 21）。"
    severity: error
    priority: 44
    confidence: 0.85
    tags: [network, load-time, environment]
    when:
      exception:
        - "java\\.net\\.UnknownHostException"
        - "java\\.security\\.cert\\.CertificateException"
        - "javax\\.net\\.ssl\\.SSLHandshakeException"
      exception_msg:
        # harvested 2026-09 (quilt-loader#344 beacon.quiltmc.org,
        # fabric-api#4707 "No subject alternative DNS name matching
        # meta.fabricmc.net found")
        - "([\\w.\\-]+\\.[a-z]{2,})"
    explanation: >-
      The game (or a mod) could not reach a remote host, or the TLS certificate
      did not match -- DNS blocking, a filtering proxy/firewall, an expired
      cert in the JVM truststore, or a corporate MITM proxy. This is an
      environment problem, not a mod bug.
    fixes:
      - "Check DNS and firewall rules for the named host; some networks (schools, ISPs, GFW-style filters) block or MITM these endpoints."
      - "If behind a corporate proxy with TLS interception, import its root CA into the JVM's cacerts (or disable interception for these hosts)."
      - "An outdated Java build can also fail on modern certs -- update Java (17/21 for current MC)."
    suspects_from: []
    provenance:
      fixtures:
      - quilt-loader/344
      - harvested:fabric-api/4707
      - harvested:fabric-loader/639
    lifecycle_status: verified

  - id: env.headless-jvm
    title: "JVM cannot load GUI libraries (headless environment)"
    title_zh: "JVM 加载不了 GUI 库（无头环境）"
    explanation_zh: >-
      有东西想开窗口（配置对话框、错误弹窗，或者客户端本身），但这个 JVM 没有图形支持，常见于精简
      Linux 或 JRE、Docker、纯命令行服务器。
    fixes_zh:
    - "Linux 上装完整 JDK 的 GUI 库：apt install openjdk-17-jdk（不是 -jre-headless），或对应发行版的 libawt_xawt 包。"
    - "如果这是服务端，出问题的代码本来就不该开 GUI：在堆栈里找到那个模组并更新它，服务端安全的模组会先判断 FMLEnvironment.dist。"
    - "Docker 里用带 AWT 的 JDK 镜像，或者设 -Djava.awt.headless=true，让调用方以一个清晰的错误失败，而不是把加载器搞崩。"
    severity: fatal
    priority: 44
    confidence: 0.9
    tags: [environment, jvm, client]
    when:
      exception:
        - "java\\.lang\\.UnsatisfiedLinkError"
        - "java\\.awt\\.HeadlessException"
      text:
        # harvested 2026-09 (quilt-loader#398): "Can't load library:
        # /usr/lib/jvm/java-17-openjdk/lib/libawt_xawt.so"
        - "libawt|Can't load library|HeadlessException|no display"
    explanation: >-
      Something tried to open a window/GUI (a config dialog, an error popup,
      the client itself) but the JVM has no graphics support -- typical on
      minimal Linux/JRE installs, Docker, or headless servers.
    fixes:
      - "On Linux, install the full JDK's GUI libs: `apt install openjdk-17-jdk` (not just -jre-headless), or the `libawt_xawt` package for your distro."
      - "If this is a SERVER, the offending code should never open a GUI -- find the mod in the stack and update it; server-safe mods check `FMLEnvironment.dist` first."
      - "In Docker, use a JDK image that includes AWT, or set `-Djava.awt.headless=true` so callers fail fast with a clear error instead of crashing the loader."
    suspects_from: ["frame_mods", "jar"]
    provenance:
      fixtures:
      - quilt-loader/398
      - harvested:quilt-loader/398
    lifecycle_status: verified

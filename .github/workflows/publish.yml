name: publish-rehearsal

# A manual, branch-safe rehearsal of the release steps. It builds and verifies
# the same way release.yml does and uploads nothing -- there is no input that
# can turn it into a publish, so a dispatch from a branch can never reach PyPI.
#
# Real publishing lives in release.yml and only runs on a v* tag, after the
# artifacts it publishes were built, verified and attached in that same run.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[pretty,test]" build

      - name: Gates
        run: |
          python tests/test_redaction.py
          python tests/eval_parser.py --strict
          python tests/test_e2e.py
          python -m pytest tests/ -q

      - name: Tag is checked by release.yml, not here
        run: echo "dispatch has no tag; release.yml compares GITHUB_REF_NAME to mcd.__version__"

      - name: Build
        run: python -m build

      - name: Verify the artifacts
        run: python tools/verify_release.py dist --sums

      - uses: actions/upload-artifact@v4
        with:
          name: rehearsal-dist
          path: dist/
          if-no-files-found: error

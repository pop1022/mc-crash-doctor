name: tests

# Two kinds of job:
#   * the matrix runs the pytest suite on the three declared Python versions --
#     the PR signal;
#   * full-gates runs everything on one version: lint, coverage floors, docs
#     numbers, contract checks, via the same script developers run locally.
#
# The corpus-dependent tests (corpus/github/**/*.crash.txt, not shipped) skip
# here and the run prints "extended gate: NOT RUN". A private job that has the
# corpus should set MCD_REQUIRE_CORPUS=1, which turns any such skip into a
# failure -- otherwise "extended gate" is a label, not a gate.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    name: parser accuracy + ground truth + redaction
    # 22.04, not latest: the 3.9 interpreter is not published for the 24.04
    # runner image, so "Set up Python 3.9" failed before the suite started.
    # Pinning the image keeps the declared >=3.9 support testable; dropping
    # 3.9 (and the requires-python floor) would be a product decision.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[pretty,test]"

      - name: Redaction (privacy boundary)
        run: python tests/test_redaction.py

      - name: Parser accuracy vs upstream expectations
        run: python tests/eval_parser.py --strict

      - name: End-to-end + ground truth
        run: python tests/test_e2e.py

      - name: Pytest corpus suite
        run: python -m pytest tests/ -q

      - name: CLI smoke
        run: |
          mc-crash-doctor --rules | head -30
          mc-crash-doctor tests/fixtures/ground-truth/crash-2026-09-08_22.42.32-server.txt --markdown | head -40
          cat tests/fixtures/ground-truth/crash-2026-09-08_18.45.43-server.txt \
            | mc-crash-doctor --stdin --json > /tmp/out.json
          python -c "import json;d=json.load(open('/tmp/out.json'));assert d['summary']['loader']=='forge', d['summary'];print('json ok, loader =', d['summary']['loader'])"

      - name: Wheel ships the YAML rules
        run: |
          pip install build
          python -m build --wheel --outdir dist
          python - <<'PY'
          import glob, sys, zipfile
          whl = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(whl).namelist()
          yml = [n for n in names if n.endswith((".yaml", ".yml"))]
          assert yml, f"no YAML rules in {whl}: {names}"
          assert len(yml) >= 2, f"expected >=2 rule packs, got {yml}"
          print(f"ok: {whl} ships {len(yml)} rule files")
          PY

  full-gates:
    name: lint + coverage + docs numbers + contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[pretty,test]" ruff build

      # The same eight gates a developer runs. Before this job, CI ran neither
      # the lint gate nor the coverage floors nor the docs-number check, so three
      # of the eight promises existed only on one machine.
      - name: All gates
        run: bash run_tests.sh
